name: Build kotlinc AOT (aarch64)

on:
  workflow_dispatch:
    inputs:
      kotlin_version:
        description: Kotlin compiler version
        required: true
        default: '2.4.10'

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM + native-image
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.2'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Install clang toolchain + zlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev

      - name: Download kotlinc
        run: |
          set -euxo pipefail
          curl -fLo /tmp/kotlinc.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${{ inputs.kotlin_version }}/kotlin-compiler-${{ inputs.kotlin_version }}.zip"
          unzip -q /tmp/kotlinc.zip -d /tmp
          ls /tmp/kotlinc/lib | head

      - name: Download Compose runtime for compile-classpath tracing
        run: |
          set -euxo pipefail
          curl -fLo /tmp/crt.aar \
            "https://dl.google.com/dl/android/maven2/androidx/compose/runtime/runtime-android/1.11.1/runtime-android-1.11.1.aar"
          mkdir -p /tmp/crt && cd /tmp/crt
          unzip -o -q /tmp/crt.aar classes.jar
          mv classes.jar /tmp/compose-runtime.jar
          ls -la /tmp/compose-runtime.jar

      - name: Generate native-image config (tracing agent, all feature paths)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ktwork /tmp/native-config

          printf 'fun main() {\n  val msg = "Hello from native kotlinc"\n  println(msg)\n}\n' > /tmp/ktwork/Main.kt

          printf 'package samplelib\nfun helper(): String = "hi"\n' > /tmp/ktwork/Helper.kt

          cat > /tmp/ktwork/Compose.kt <<'EOF'
          package com.example.sample

          import androidx.compose.runtime.Composable

          @Composable
          fun GreetingMessage(title: String): String {
              return "Hello from AOT Compose: $title"
          }

          @Composable
          fun render() {
              println(GreetingMessage("world"))
          }
          EOF

          cd /tmp/kotlinc

          # 1. plain compile (stdlib only)
          java -agentlib:native-image-agent=config-output-dir=/tmp/native-config \
            -cp "lib/*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            /tmp/ktwork/Main.kt -d /tmp/ktwork/out.jar -nowarn

          # 2. compile with a user classpath (setClasspath) + source from jar
          java -agentlib:native-image-agent=config-merge-dir=/tmp/native-config \
            -cp "lib/*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            -cp /tmp/compose-runtime.jar -d /tmp/ktwork/out2.jar \
            /tmp/ktwork/Compose.kt -nowarn

          # 3. compose plugin explicitly enabled with options (setPluginClasspaths/setPluginOptions)
          java -agentlib:native-image-agent=config-merge-dir=/tmp/native-config \
            -cp "lib/*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            -cp /tmp/compose-runtime.jar \
            -Xplugin=lib/compose-compiler-plugin.jar \
            -P plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true \
            -d /tmp/ktwork/out3.jar /tmp/ktwork/Compose.kt -nowarn

          # 4. self-contained runnable jar (setIncludeRuntime)
          java -agentlib:native-image-agent=config-merge-dir=/tmp/native-config \
            -cp "lib/*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            /tmp/ktwork/Main.kt -d /tmp/ktwork/out4.jar -include-runtime -nowarn

          # 5. language/api version + jvm-target + module name + mpp + progressive
          java -agentlib:native-image-agent=config-merge-dir=/tmp/native-config \
            -cp "lib/*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            -language-version 2.4 -api-version 2.4 -jvm-target 17 \
            -module-name samplemod -Xmulti-platform -progressive \
            /tmp/ktwork/Main.kt -d /tmp/ktwork/out5.jar -nowarn

          find /tmp/native-config -type f

      - name: Add handwritten reflection config (guaranteed arg coverage)
        run: |
          set -euxo pipefail
          cp kotlinc-native/reflect-config.json /tmp/native-config/reflect-config.json
          cat /tmp/native-config/reflect-config.json

      - name: Strip broken jline native-image config
        run: |
          set -euxo pipefail
          python3 - <<'EOF'
          import zipfile, os
          jar = "/tmp/kotlinc/lib/kotlin-compiler.jar"
          dst = jar + ".fixed"
          zin = zipfile.ZipFile(jar, "r")
          zout = zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED)
          for item in zin.infolist():
              if "META-INF/native-image" in item.filename:
                  continue
              zout.writestr(item, zin.read(item.filename))
          zout.close()
          zin.close()
          os.replace(dst, jar)
          EOF
          echo "stripped"

      - name: Compile PathUtil substitution
        run: |
          set -euxo pipefail
          "$JAVA_HOME/bin/jmod" extract --dir /tmp/ni-mod "$JAVA_HOME/jmods/org.graalvm.nativeimage.jmod"
          mkdir -p /tmp/subst-classes
          javac -cp /tmp/ni-mod/classes -d /tmp/subst-classes \
            kotlinc-native/PathUtilSubstitution.java

      - name: Build kotlinc native image
        run: |
          set -euxo pipefail
          cd /tmp/kotlinc
          native-image \
            -cp "lib/*:/tmp/subst-classes" \
            -H:ConfigurationFileDirectories=/tmp/native-config \
            -H:IncludeResources='.*' \
            -H:CCompilerPath=/usr/bin/clang \
            -H:+AllowJRTFileSystem \
            -H:+AddAllCharsets \
            --future-defaults=run-time-initialize-file-system-providers \
            --initialize-at-run-time=org.jetbrains.kotlin,com.intellij,org.fusesource,jdk.internal.jrtfs,jdk.internal.jimage \
            -march=compatibility \
            -J-Xmx10g \
            -H:+ReportExceptionStackTraces \
            -H:Name=kotlinc \
            org.jetbrains.kotlin.cli.jvm.K2JVMCompiler
          ls -la kotlinc

      - name: Verify plain compile + run
        run: |
          set -euxo pipefail
          /tmp/kotlinc/kotlinc -Dkotlin.home=/tmp/kotlinc -Djava.home="$JAVA_HOME" \
            /tmp/ktwork/Main.kt -d /tmp/ktwork/verify.jar -nowarn
          java -cp /tmp/ktwork/verify.jar MainKt

      - name: Verify runnable jar (-include-runtime)
        run: |
          set -euxo pipefail
          /tmp/kotlinc/kotlinc -Dkotlin.home=/tmp/kotlinc -Djava.home="$JAVA_HOME" \
            /tmp/ktwork/Main.kt -d /tmp/ktwork/verify-runnable.jar -include-runtime -nowarn
          java -jar /tmp/ktwork/verify-runnable.jar

      - name: Verify Compose compilation with the native binary
        run: |
          set -euxo pipefail
          /tmp/kotlinc/kotlinc -Dkotlin.home=/tmp/kotlinc -Djava.home="$JAVA_HOME" \
            -cp /tmp/compose-runtime.jar -d /tmp/ktwork/verify-compose.jar \
            /tmp/ktwork/Compose.kt -nowarn
          if "$JAVA_HOME/bin/javap" -classpath /tmp/ktwork/verify-compose.jar -p \
              com.example.sample.ComposeKt | grep -q Composer; then
            echo "PASS: composable transformed (Composer injected)"
          else
            echo "FAIL: @Composable not transformed by compose compiler plugin"
            "$JAVA_HOME/bin/javap" -classpath /tmp/ktwork/verify-compose.jar -p \
              com.example.sample.ComposeKt || true
            exit 1
          fi

      - name: Check no build-time java.home is baked
        run: |
          set -euxo pipefail
          if strings /tmp/kotlinc/kotlinc | grep -q hostedtoolcache; then
            echo "FAIL: baked build-time java.home present in binary"
            exit 1
          fi
          echo "PASS: no baked java.home in binary"

      - name: Upload aarch64 binary
        uses: actions/upload-artifact@v4
        with:
          name: kotlinc-linux-aarch64
          path: /tmp/kotlinc/kotlinc
          if-no-files-found: error
