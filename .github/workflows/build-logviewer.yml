name: Build logviewer app + server smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/logviewer/**'
      - '.github/workflows/build-logviewer.yml'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android command line tools
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

      - name: Install SDK platform 36 + build-tools (37.0.0 has aarch64 aapt2)
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -euxo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;37.0.0"
          set -o pipefail
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" version

      - name: Build APKs (debug + release)
        working-directory: apps/logviewer
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -euxo pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/37.0.0/aapt2"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: logviewer-apk
          path: apps/logviewer/app/build/outputs/apk/debug/app-debug.apk

      - name: Server smoke test (gh workflow logs over localhost)
        run: |
          set -euxo pipefail
          python3 apps/logviewer/server/serve.py 8787 &
          SRV=$!
          sleep 2
          curl -fsS --max-time 10 http://127.0.0.1:8787/status | grep -q '"ok": true'
          RUNS=$(curl -fsS --max-time 20 http://127.0.0.1:8787/runs)
          RUN_ID=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['runs'][0]['databaseId'])" "$RUNS")
          echo "fetched workflow logs for run $RUN_ID"
          curl -fsS --max-time 120 "http://127.0.0.1:8787/log?run=$RUN_ID" | tail -n 1
          kill $SRV
