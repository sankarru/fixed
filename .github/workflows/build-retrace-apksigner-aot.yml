name: Build Retrace/Apksigner AOT (aarch64)

on:
  workflow_dispatch:
    inputs:
      build_tools_version:
        description: Android build-tools version (apksigner.jar source)
        required: true
        default: '37.0.0'

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM + native-image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Install clang toolchain + zlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev

      - name: Download Android command line tools
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

      - name: Install build-tools (apksigner + d8/r8 libs)
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -euxo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" "build-tools;${{ inputs.build_tools_version }}"
          set -o pipefail

      - name: Prepare test keystores
        run: |
          set -euxo pipefail
          mkdir -p /tmp/apktest
          cp testdata/unsigned.apk /tmp/apktest/unsigned.apk
          "$JAVA_HOME/bin/keytool" -genkeypair -alias test -keyalg RSA -keysize 2048 \
            -storetype JKS -storepass password -keypass password \
            -keystore /tmp/apktest/ks_rsa.jks -dname "CN=Test,O=Test,C=US" -validity 10000
          "$JAVA_HOME/bin/keytool" -genkeypair -alias test -keyalg EC -groupname secp256r1 \
            -storetype JKS -storepass password -keypass password \
            -keystore /tmp/apktest/ks_ec.jks -dname "CN=Test,O=Test,C=US" -validity 10000

      - name: Generate apksigner native config (tracing agent)
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -euxo pipefail
          JAR="$ANDROID_HOME/build-tools/${{ inputs.build_tools_version }}/lib/apksigner.jar"
          java -agentlib:native-image-agent=config-output-dir=/tmp/apksigner-config \
            -jar "$JAR" sign \
            --ks /tmp/apktest/ks_rsa.jks --ks-pass pass:password \
            --out /tmp/apktest/traced_rsa.apk /tmp/apktest/unsigned.apk
          java -agentlib:native-image-agent=config-merge-dir=/tmp/apksigner-config \
            -jar "$JAR" sign \
            --ks /tmp/apktest/ks_ec.jks --ks-pass pass:password \
            --out /tmp/apktest/traced_ec.apk /tmp/apktest/unsigned.apk
          java -agentlib:native-image-agent=config-merge-dir=/tmp/apksigner-config \
            -jar "$JAR" verify /tmp/apktest/traced_rsa.apk
          find /tmp/apksigner-config -type f

      - name: Compile native-image substitutions
        run: |
          set -euxo pipefail
          "$JAVA_HOME/bin/jmod" extract --dir /tmp/ni-mod \
            "$JAVA_HOME/jmods/org.graalvm.nativeimage.jmod"
          mkdir -p /tmp/subst-classes
          javac -cp /tmp/ni-mod/classes -d /tmp/subst-classes \
            kotlinc-native/ApkSignerToolSubstitution.java

      - name: Build retrace native image
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -euxo pipefail
          native-image \
            -cp "$ANDROID_HOME/cmdline-tools/latest/lib/r8.jar" \
            --initialize-at-build-time \
            -H:ReflectionConfigurationFiles="$GITHUB_WORKSPACE/.github/workflows/reflect-config.json" \
            -H:CCompilerPath=/usr/bin/clang \
            -march=compatibility \
            -J-Xmx6g \
            -H:+ReportExceptionStackTraces \
            -H:Name=retrace \
            com.android.tools.r8.retrace.Retrace

      - name: Build apksigner native image
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -euxo pipefail
          native-image \
            -cp "$ANDROID_HOME/build-tools/${{ inputs.build_tools_version }}/lib/apksigner.jar:/tmp/subst-classes" \
            -H:ConfigurationFileDirectories=/tmp/apksigner-config \
            -H:CCompilerPath=/usr/bin/clang \
            -march=compatibility \
            --enable-all-security-services \
            -J-Xmx6g \
            -H:+ReportExceptionStackTraces \
            -H:Name=apksigner \
            com.android.apksigner.ApkSignerTool

      - name: Verify retrace
        run: |
          ./retrace --version

      - name: Verify apksigner (RSA + EC, v1+v2+v3)
        run: |
          set -euxo pipefail
          ./apksigner sign \
            --ks /tmp/apktest/ks_rsa.jks --ks-pass pass:password \
            --out /tmp/apktest/native_rsa.apk /tmp/apktest/unsigned.apk
          ./apksigner verify /tmp/apktest/native_rsa.apk
          ./apksigner sign \
            --ks /tmp/apktest/ks_ec.jks --ks-pass pass:password \
            --out /tmp/apktest/native_ec.apk /tmp/apktest/unsigned.apk
          ./apksigner verify /tmp/apktest/native_ec.apk

      - name: Upload aarch64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: retrace-apksigner-linux-aarch64
          path: |
            retrace
            apksigner
          if-no-files-found: error
